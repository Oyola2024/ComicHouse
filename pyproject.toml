[project]
name = "comichouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oyola2024", email = "f.oyola@itecriocuarto.org.ar" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pillow>=13.0.0",
]

[project.scripts]
comichouse = "comichouse:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
